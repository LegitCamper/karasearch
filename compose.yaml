services:
  karasearch:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      KARAKEEP_URL: ${KARAKEEP_URL:-http://host.docker.internal:3000}
      SEARCH_URL: ${SEARCH_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_STORE: /data/sessions.enc
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env to a stable random secret}
    volumes:
      - sessions:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sessions:
